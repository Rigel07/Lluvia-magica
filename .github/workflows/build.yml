name: Build Lluvia Magica

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.1.1

      - name: Build
        run: |
          SETTINGS=$(find . -name settings.gradle -not -path './.git/*' | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "No se encuentra settings.gradle en el repositorio. Faltan archivos del mod."
            exit 1
          fi
          cd "$(dirname "$SETTINGS")"
          gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: lluvia-magica-jar
          path: "**/build/libs/*.jar"
